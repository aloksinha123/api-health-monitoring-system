<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Health Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0c;
            --surface: #141417;
            --surface-hover: #1c1c21;
            --primary: #FF6600;
            --primary-glow: rgba(255, 102, 0, 0.3);
            --primary-light: #ff8533;
            --text-main: #ffffff;
            --text-muted: #8e8e9e;
            --danger: #ff3333;
            --danger-glow: rgba(255, 51, 51, 0.3);
            --border: rgba(255, 255, 255, 0.05);
            --border-highlight: rgba(255, 102, 0, 0.2);
            --border-radius-lg: 16px;
            --border-radius-md: 12px;
            --border-radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 102, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 102, 0, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Banner */
        #warning-banner {
            background: linear-gradient(90deg, #3a0808, #600f0f);
            color: #ffcccc;
            padding: 12px 24px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--danger);
            animation: slideDown 0.4s ease-out;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.15);
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-container {
            max-width: 1200px;
            margin: 40px auto 20px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(90deg, #fff, #ffccaa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--primary);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        button {
            background: rgba(255, 102, 0, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 24px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px var(--primary-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 25px var(--primary-glow);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button svg.refresh-icon {
            transition: transform 0.3s;
        }

        button:hover svg.refresh-icon {
            transform: rotate(180deg);
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 24px;
        }

        /* Chart Section */
        .chart-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .chart-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.5;
        }

        /* Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* Card Styles */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--border-radius-md);
            padding: 24px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--border-highlight);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow);
            background: var(--surface-hover);
        }

        .card-down::before {
            background: var(--danger);
            box-shadow: 0 0 15px var(--danger);
        }

        .card-down:hover {
            border-color: rgba(255, 51, 51, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 20px var(--danger-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .card-header h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            word-break: break-all;
            line-height: 1.4;
            color: #fff;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .status-up {
            background: rgba(255, 102, 0, 0.1);
            color: var(--primary-light);
            border: 1px solid rgba(255, 102, 0, 0.2);
        }

        .status-down {
            background: rgba(255, 51, 51, 0.1);
            color: #ff6666;
            border: 1px solid rgba(255, 51, 51, 0.2);
        }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-up .pulse {
            background-color: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            animation: pulse-orange 2s infinite;
        }

        .status-down .pulse {
            background-color: var(--danger);
            box-shadow: 0 0 8px var(--danger);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(255, 102, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0); }
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 8px;
        }

        .detail-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 500;
            color: #e0e0e0;
        }
        
        .text-warning {
            color: #ffaa00;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-titles {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="warning-banner"></div>

    <div class="header-container">
        <div class="header-titles">
            <div class="subtitle">System Status</div>
            <h1>API Health Monitor</h1>
            <div style="display: flex; gap: 16px; align-items: center; margin-top: 8px; flex-wrap: wrap;">
                <div id="stats" style="color: var(--text-muted); font-size: 14px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;"></div>
                <div id="lastUpdate" style="color: var(--primary); font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; background: rgba(255, 102, 0, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255, 102, 0, 0.2); box-shadow: 0 0 10px rgba(255, 102, 0, 0.1);"></div>
            </div>
        </div>
        <button id="refreshBtn" onclick="refreshData()">
            <svg class="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
            Refresh Data
        </button>
    </div>

    <div class="dashboard">
        <div class="chart-wrapper">
            <canvas id="responseTimeChart" height="80"></canvas>
        </div>
        <div class="container" id="apiContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
